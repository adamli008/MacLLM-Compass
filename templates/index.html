<!DOCTYPE html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="依您的工作与 Mac 硬件，缩小本地模型的选择。"><title>Mac 模型指南</title><link rel="stylesheet" href="/_astro/Base.BNiCf3Po.css"></head><body><a class="skip" href="#content">跳到主要内容</a><header class="site-header"><div class="container header-inner"><a class="brand" href="/">Mac 模型指南</a><nav aria-label="主要导航"><a href="/start/">选模型</a><a href="/example/">结果范例</a><a href="/playground/">本地模型对话</a></nav></div></header><main id="content" class="container"><section class="hero"><h1>您的 Mac，接下来想用它来做什么？</h1><p class="lede">一页填完：选择您的 Mac 芯片、内存、用途（可复选），并写下具体描述，即可立即查看推荐的本地候选模型。</p><div class="actions"><a class="button primary" href="/start/">开始选模型</a><a class="button secondary" href="/example/">先看结果范例</a></div></section><section class="panel"><h2>填写前须知</h2><ul><li>选择您的 Mac 芯片与统一内存</li><li>勾选您的用途（聊天、Coding、Agent，可复选），以及具体任务描述</li><li><b>无需填写 Email，无需人机验证，即开即用</b></li></ul><p>所有硬件和描述信息均在本地处理，点击“查看候选模型”后，匹配的本地模型列表将立即呈现在网页下方。</p><p class="notice">本地运行版本：已去除繁琐的邮箱订阅和验证流程，直接呈现完美推荐。</p></section></main></body></html>
